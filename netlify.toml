[build]
command = "npm run build"
publish = "dist"
functions = "netlify/functions"

# O .env.example é só um modelo (vai pro Git) e tem valores como smtp.ethereal.email.
# Sem isso, o scanner de segredos da Netlify acha o valor e derruba o build.
[build.environment]
SECRETS_SCAN_OMIT_PATHS = ".env.example"

[[redirects]]
from = "/api/*"
to = "/.netlify/functions/:splat"
status = 200
